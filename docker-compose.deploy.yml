services:
  server:
    image: akshatcreates/smart-leads-server:latest
    restart: unless-stopped
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN}
      - PORT=4000
    expose:
      - "4000"

  client:
    image: akshatcreates/smart-leads-client:latest
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - server
      - client
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
