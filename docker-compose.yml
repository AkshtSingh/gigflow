services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      - MONGODB_URI=YOURURI
      - JWT_SECRET=YOURSECRET
      - PORT=4000
    ports:
      - '4000:4000'
    depends_on:
      - mongo

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - '5173:80'
    environment:
      - VITE_API_URL=http://localhost:4000

volumes:
  mongo-data:
    driver: local
